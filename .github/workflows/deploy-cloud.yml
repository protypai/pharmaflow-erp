name: Deploy Cloud Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/cloud-backend/**'
      - 'docker-compose.yml'
      - 'nginx/**'

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/cloud-backend
          push: true
          tags: ghcr.io/protypai/pharmaflow-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read
    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 60m
          script: |
            set -e
            if [ ! -d "$HOME/pharmaflow-erp" ]; then
              echo "Directory ~/pharmaflow-erp does not exist. Cloning repository for first-time setup..."
              git clone https://github.com/protypai/pharmaflow-erp.git "$HOME/pharmaflow-erp"
            fi
            cd "$HOME/pharmaflow-erp"

            echo "Pulling latest code..."
            git pull origin main

            echo "Writing .env.production from secrets..."
            printf '%s\n' \
              "NODE_ENV=production" \
              "LOG_LEVEL=info" \
              "PORT=5000" \
              "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" \
              "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" \
              "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" \
              "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}?connection_limit=15" \
              "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
              "JWT_EXPIRES_IN=15m" \
              "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" \
              "JWT_REFRESH_EXPIRES_IN=30d" \
              "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" \
              "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" \
              "CORS_ORIGIN=*" \
              "FRONTEND_URL=http://${{ secrets.SSH_HOST }}" \
              "HTTP_PORT=80" \
              "HTTPS_PORT=443" \
              "RUN_SEEDING=true" \
              > .env.production

            cp .env.production .env

            echo "Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pulling pre-built images..."
            docker compose pull backend

            echo "Starting services..."
            docker compose up -d --remove-orphans

            echo "Restarting nginx..."
            docker compose restart nginx
            sleep 3

            echo "Waiting for health check..."
            timeout 120 bash -c \
            "until curl -sf http://localhost:8080/health > /dev/null; do
              echo 'waiting...'
              sleep 5
            done"

            echo "Deploy complete!"
            docker ps --format "table {{.Names}}\t{{.Status}}"
