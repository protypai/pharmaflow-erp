name: Release Desktop App (.exe)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Monorepo Root Dependencies
        run: npm install --ignore-scripts

      - name: Install Desktop App Dependencies
        run: npm install
        working-directory: apps/desktop

      - name: Rebuild Native SQLite Module for Electron
        run: npx @electron/rebuild -f -w better-sqlite3
        working-directory: apps/desktop

      - name: Build React UI & Compile TypeScript
        run: npm run build
        working-directory: apps/desktop
        env:
          VITE_CLOUD_API_URL: https://api.pharmaflow.in
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_UPDATER_REPO: protypai/pharmaflow-releases

      - name: Build Electron .exe Installer
        run: npx electron-builder --win nsis --config.electronVersion=31.0.0
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .exe Installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: PharmaFlow ERP ${{ github.ref_name }}
          body: |
            ## PharmaFlow ERP ${{ github.ref_name }}

            ### Installation Instructions
            1. Download `PharmaFlow-Setup-${{ github.ref_name }}.exe`
            2. Double click to run the installer on your Windows laptop
            3. Follow the quick setup wizard
            4. Launch from your Desktop shortcut

            ### Default Team Credentials
            - **Store Admin**: `demo@pharmaflow.in` / `Password@123`
            - **Super Admin**: `admin@pharmaflow.in` / `Admin@123`
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
