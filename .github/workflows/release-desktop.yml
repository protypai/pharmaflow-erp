name: Release Desktop App (.exe)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Monorepo Root Dependencies
        run: npm ci --ignore-scripts

      - name: Install Desktop App Dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Rebuild Native SQLite Module for Electron
        run: npx @electron/rebuild -f -w better-sqlite3
        working-directory: apps/desktop

      - name: Build React UI & Compile TypeScript
        run: npm run build
        working-directory: apps/desktop
        env:
          VITE_CLOUD_API_URL: https://api.pharmaflow.in
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_UPDATER_REPO: protypai/pharmaflow-releases

      - name: Verify Build Output
        run: |
          echo "Checking build output..."
          if (-Not (Test-Path "dist/index.html")) { throw "Missing dist/index.html" }
          if (-Not (Test-Path "dist-electron/electron/main.js")) { throw "Missing dist-electron/electron/main.js" }
          if (-Not (Test-Path "dist-electron/electron/preload.js")) { throw "Missing dist-electron/electron/preload.js" }
          echo "✓ All build artifacts present"
        working-directory: apps/desktop

      - name: Build Electron .exe Installer
        run: npx electron-builder --config electron-builder.config.js --win nsis --publish never
        working-directory: apps/desktop

      - name: Locate compiled installer files
        run: |
          Write-Host "Looking for .exe files..."
          Get-ChildItem -Path "release" -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          Get-ChildItem -Path "release" -Filter "latest.yml" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Found: $($_.FullName)" }
        working-directory: apps/desktop

      - name: Upload .exe Installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: PharmaFlow ERP ${{ github.ref_name }}
          body: |
            ## PharmaFlow ERP ${{ github.ref_name }}

            ### ✅ What's New
            - **Fixed:** Electron white screen issue (stable loading)
            - **Fixed:** Windows file path handling
            - **Fixed:** Asset loading in production
            - **Improved:** Build validation

            ### Installation Instructions
            1. Download `PharmaFlow ERP Setup *.exe`
            2. Double click to run the installer on your Windows laptop
            3. Follow the quick setup wizard
            4. Launch from your Desktop shortcut

            ### Default Team Credentials
            - **Store Admin**: `demo@pharmaflow.in` / `Password@123`
            - **Super Admin**: `admin@pharmaflow.in` / `Admin@123`

            ### System Requirements
            - Windows 10 or newer
            - 4GB RAM minimum
            - 500MB free disk space

          files: |
            apps/desktop/release/PharmaFlow ERP *.exe
            apps/desktop/release/latest.yml
