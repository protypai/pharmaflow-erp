name: Release Desktop App (.exe)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build React UI
        run: npm run build
        working-directory: apps/desktop
        env:
          VITE_CLOUD_API_URL: https://api.pharmaflow.in
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_UPDATER_REPO: protypai/pharmaflow-releases

      - name: Compile TypeScript (Electron)
        run: npx tsc --project tsconfig.json
        working-directory: apps/desktop

      - name: Build Electron .exe
        run: npm run electron:build
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}

      - name: Upload .exe to Public Releases Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: protypai/pharmaflow-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          name: PharmaFlow ERP ${{ github.ref_name }}
          body: |
            ## PharmaFlow ERP ${{ github.ref_name }}

            ### Installation
            1. Download `PharmaFlow-Setup-${{ github.ref_name }}.exe`
            2. Run as Administrator
            3. Follow the installation wizard
            4. Launch from Desktop shortcut

            ### What's included
            - Offline-first pharmacy management
            - Automatic sync when internet is available
            - Windows System Tray support
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
