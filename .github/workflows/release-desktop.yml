name: Release Desktop App (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Monorepo Root Dependencies
        run: npm ci --ignore-scripts

      - name: Install Desktop App Dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build React UI & Compile TypeScript
        run: npm run build
        working-directory: apps/desktop
        env:
          VITE_CLOUD_API_URL: ${{ secrets.VITE_CLOUD_API_URL != '' && secrets.VITE_CLOUD_API_URL || format('http://{0}', secrets.SSH_HOST) }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_UPDATER_REPO: protypai/pharmaflow-erp

      - name: Verify Build Output
        run: |
          echo "Checking build output..."
          if (-Not (Test-Path "dist/index.html")) { throw "Missing dist/index.html" }
          if (-Not (Test-Path "dist-electron/electron/main.js")) { throw "Missing dist-electron/electron/main.js" }
          if (-Not (Test-Path "dist-electron/electron/preload.js")) { throw "Missing dist-electron/electron/preload.js" }
          echo "✓ All build artifacts present"
        working-directory: apps/desktop

      - name: Sync package.json Version with Git Tag
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("v")) { $tag = $tag.Substring(1) }
          npm version $tag --no-git-tag-version --allow-same-version
        working-directory: apps/desktop

      - name: Build Electron .exe Installers (x64, ia32, arm64)
        run: npx electron-builder --config electron-builder.config.js --win nsis --publish never
        working-directory: apps/desktop

      - name: Ensure latest.yml exists for Auto-Updater
        run: |
          Write-Host "Files in release folder:"
          Get-ChildItem -Path "release"
          
          if (-Not (Test-Path "release/latest.yml")) {
            if (Test-Path "release/latest-x64.yml") {
              Copy-Item "release/latest-x64.yml" "release/latest.yml" -Force
              Write-Host "Created latest.yml from latest-x64.yml"
            } elseif (Test-Path "release/latest-ia32.yml") {
              Copy-Item "release/latest-ia32.yml" "release/latest.yml" -Force
              Write-Host "Created latest.yml from latest-ia32.yml"
            } else {
              Write-Host "WARNING: Could not find any latest*.yml file!"
            }
          } else {
            Write-Host "latest.yml already generated natively by electron-builder."
          }
        working-directory: apps/desktop

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  publish-release:
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download All Installer Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List Release Assets
        run: |
          Get-ChildItem -Recurse -Path release-assets | ForEach-Object { Write-Host "Found: $($_.FullName)" }

      - name: Upload .exe Installers to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: PharmaFlow ERP ${{ github.ref_name }}
          body: |
            ## PharmaFlow ERP ${{ github.ref_name }}

            ### ✅ What's New
            - **Fixed:** Electron white screen issue (stable loading)
            - **Fixed:** Windows file path handling
            - **Fixed:** Asset loading in production
            - **Improved:** Build validation

            ### Installation Instructions
            1. Download the installer that matches your Windows architecture
            2. Double click to run the installer
            3. Follow the quick setup wizard
            4. Launch from your Desktop shortcut

            ### Default Access
            - Configure the store admin and super admin accounts from your deployment secrets before first use.

            ### System Requirements
            - Windows 10 or newer
            - 32-bit, 64-bit, or ARM64 Windows depending on the installer you download
            - 4GB RAM minimum
            - 500MB free disk space

          files: |
            release-assets/**/*.exe
            release-assets/**/latest*.yml
