name: Release Desktop App (.exe)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [ia32, x64, arm64]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Monorepo Root Dependencies
        run: npm ci --ignore-scripts

      - name: Install Desktop App Dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build React UI & Compile TypeScript
        run: npm run build
        working-directory: apps/desktop
        env:
          VITE_CLOUD_API_URL: ${{ secrets.VITE_CLOUD_API_URL != '' && secrets.VITE_CLOUD_API_URL || format('http://{0}:5000', secrets.SSH_HOST) }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_UPDATER_REPO: protypai/pharmaflow-releases

      - name: Verify Build Output
        run: |
          echo "Checking build output..."
          if (-Not (Test-Path "dist/index.html")) { throw "Missing dist/index.html" }
          if (-Not (Test-Path "dist-electron/electron/main.js")) { throw "Missing dist-electron/electron/main.js" }
          if (-Not (Test-Path "dist-electron/electron/preload.js")) { throw "Missing dist-electron/electron/preload.js" }
          echo "✓ All build artifacts present"
        working-directory: apps/desktop

      - name: Build Electron .exe Installer
        run: npx electron-builder --config electron-builder.config.js --win nsis --${{ matrix.arch }} --publish never
        working-directory: apps/desktop

      - name: Locate compiled installer files
        run: |
          Write-Host "Looking for .exe files..."
          $exeFiles = Get-ChildItem -Path "release" -Filter "*.exe" -ErrorAction SilentlyContinue
          $metadataFiles = Get-ChildItem -Path "release" -Filter "latest*.yml" -ErrorAction SilentlyContinue

          $exeFiles | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          $metadataFiles | ForEach-Object { Write-Host "Found: $($_.FullName)" }

          if ($exeFiles.Count -lt 1) { throw "Expected 1 installer EXE for ${{ matrix.arch }} but found none" }
          if ($metadataFiles.Count -lt 1) { throw "Expected update metadata file for ${{ matrix.arch }} but none was found" }

          $archMetadata = Join-Path "release" "latest-${{ matrix.arch }}.yml"
          Copy-Item $metadataFiles[0].FullName $archMetadata -Force
        working-directory: apps/desktop

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest-${{ matrix.arch }}.yml
          if-no-files-found: error

  publish-release:
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download All Installer Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List Release Assets
        run: |
          Get-ChildItem -Recurse -Path release-assets | ForEach-Object { Write-Host "Found: $($_.FullName)" }

      - name: Upload .exe Installers to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: PharmaFlow ERP ${{ github.ref_name }}
          body: |
            ## PharmaFlow ERP ${{ github.ref_name }}

            ### ✅ What's New
            - **Fixed:** Electron white screen issue (stable loading)
            - **Fixed:** Windows file path handling
            - **Fixed:** Asset loading in production
            - **Improved:** Build validation

            ### Installation Instructions
            1. Download the installer that matches your Windows architecture
            2. Double click to run the installer
            3. Follow the quick setup wizard
            4. Launch from your Desktop shortcut

            ### Default Access
            - Configure the store admin and super admin accounts from your deployment secrets before first use.

            ### System Requirements
            - Windows 10 or newer
            - 32-bit, 64-bit, or ARM64 Windows depending on the installer you download
            - 4GB RAM minimum
            - 500MB free disk space

          files: |
            release-assets/**/PharmaFlow ERP *.exe
            release-assets/**/latest*.yml
