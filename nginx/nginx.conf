worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript;
  keepalive_timeout 65;

  # Health check endpoint for Docker
  server {
    listen 8080;
    location /health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }

  server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS in production
    # Comment out if not using SSL
    # return 301 https://$host$request_uri;

    # API routes
    location /api/ {
      proxy_pass         http://pharmaflow-backend:5000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 300s;
      client_max_body_size 20M;
    }

    # Deny direct access to backend ports
    location / {
      return 404 'PharmaFlow Cloud Sync API';
    }
  }

  # HTTPS server (uncomment and set domain when ready)
  # server {
  #   listen 443 ssl;
  #   server_name api.pharmaflow.in;
  #   ssl_certificate /etc/letsencrypt/live/api.pharmaflow.in/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/api.pharmaflow.in/privkey.pem;
  #   location /api/ {
  #     proxy_pass http://pharmaflow-backend:5000;
  #   }
  # }
}
