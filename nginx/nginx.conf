worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript;
  keepalive_timeout 65;

  # Shared proxy settings for the backend, reused by both the HTTP (dev) and
  # HTTPS (prod) server blocks below.
  # ---------------------------------------------------------------------------

  # Health check endpoint for Docker (kept plain-HTTP on an internal port)
  server {
    listen 8080;
    location /health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }

  # ---------------------------------------------------------------------------
  # HTTP (port 80)
  #
  # In PRODUCTION this block only:
  #   1. Serves the ACME/Let's Encrypt HTTP-01 challenge (so certs can renew).
  #   2. Redirects every other request to HTTPS.
  #
  # For LOCAL/DEV without TLS certs, the 443 server block will fail to start
  # because the cert files are absent. In that case, comment out the 443 block
  # below AND comment out the `return 301 ...` redirect here, then uncomment the
  # "LOCAL/DEV proxy fallback" location so the API is reachable over plain HTTP.
  # ---------------------------------------------------------------------------
  server {
    listen 80;
    server_name _;

    # ACME HTTP-01 challenge for Let's Encrypt certificate issuance/renewal.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS (production default).
    location / {
      return 301 https://$host$request_uri;
    }

    # --- LOCAL/DEV proxy fallback (no TLS) ------------------------------------
    # Uncomment the two locations below (and comment the `location /` redirect
    # above + the whole 443 server block) to run without certificates.
    #
    # location /api/ {
    #   proxy_pass         http://pharmaflow-backend:5000;
    #   proxy_http_version 1.1;
    #   proxy_set_header   Upgrade $http_upgrade;
    #   proxy_set_header   Connection 'upgrade';
    #   proxy_set_header   Host $host;
    #   proxy_set_header   X-Real-IP $remote_addr;
    #   proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header   X-Forwarded-Proto $scheme;
    #   proxy_cache_bypass $http_upgrade;
    #   proxy_read_timeout 300s;
    #   client_max_body_size 20M;
    # }
    # location / {
    #   return 404 'PharmaFlow Cloud Sync API';
    # }
    # --------------------------------------------------------------------------
  }

  # ---------------------------------------------------------------------------
  # HTTPS (port 443) — production
  #
  # Certificates: the docker-compose mounts /etc/letsencrypt (read-only), so the
  # Let's Encrypt paths below are the defaults. To use certs mounted elsewhere
  # (e.g. /etc/nginx/certs/fullchain.pem and /etc/nginx/certs/privkey.pem),
  # change ssl_certificate / ssl_certificate_key accordingly and mount that dir.
  #
  # Update server_name to your real domain before issuing certificates.
  # ---------------------------------------------------------------------------
  server {
    listen 443 ssl;
    http2 on;
    server_name api.pharmaflow.in;

    ssl_certificate     /etc/letsencrypt/live/api.pharmaflow.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pharmaflow.in/privkey.pem;

    # Modern TLS configuration
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_tickets       off;

    # HSTS — force HTTPS for 1 year (incl. subdomains). Remove/reduce max-age
    # only if you knowingly need to serve this host over plain HTTP again.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API routes
    location /api/ {
      proxy_pass         http://pharmaflow-backend:5000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 300s;
      client_max_body_size 20M;
    }

    # Deny direct access to anything else
    location / {
      return 404 'PharmaFlow Cloud Sync API';
    }
  }
}
