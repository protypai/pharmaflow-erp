networks:
  pharmaflow-network:
    name: pharmaflow_shared_network
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmaflow-postgres
    restart: unless-stopped
    networks: [pharmaflow-network]
    expose:
      - "5432"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/cloud-backend
      dockerfile: Dockerfile
    container_name: pharmaflow-backend
    restart: unless-stopped
    networks: [pharmaflow-network]
    environment:
      DATABASE_URL:       postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=15
      PORT:               "5000"
      NODE_ENV:           production
      JWT_SECRET:         ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_EMAIL:        ${ADMIN_EMAIL}
      ADMIN_PASSWORD:     ${ADMIN_PASSWORD}
      CORS_ORIGIN:        ${CORS_ORIGIN:-*}
      LOG_LEVEL:          info
      RUN_SEEDING:        ${RUN_SEEDING:-false}
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: pharmaflow-nginx
    restart: unless-stopped
    networks: [pharmaflow-network]
    expose:
      - "80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
