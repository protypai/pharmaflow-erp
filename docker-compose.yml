networks:
  pharmaflow-network:
    name: pharmaflow_shared_network
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmaflow-postgres
    restart: unless-stopped
    networks: [pharmaflow-network]
    expose:
      - "5432"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/cloud-backend
      dockerfile: Dockerfile
    container_name: pharmaflow-backend
    restart: unless-stopped
    networks: [pharmaflow-network]
    environment:
      POSTGRES_USER:          ${POSTGRES_USER}
      DATABASE_URL:           ${DATABASE_URL}
      PORT:                   "5000"
      NODE_ENV:               ${NODE_ENV:-production}
      JWT_SECRET:             ${JWT_SECRET}
      JWT_REFRESH_SECRET:     ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN:         ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      ADMIN_EMAIL:            ${ADMIN_EMAIL}
      ADMIN_PASSWORD:         ${ADMIN_PASSWORD}
      CORS_ORIGIN:            ${CORS_ORIGIN:-*}
      LOG_LEVEL:              ${LOG_LEVEL:-info}
      RUN_SEEDING:            ${RUN_SEEDING:-false}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: pharmaflow-nginx
    restart: unless-stopped
    networks: [pharmaflow-network]
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
