version: "3.9"

networks:
  pharmaflow-network:
    name: pharmaflow_shared_network
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmaflow-postgres
    restart: unless-stopped
    networks: [pharmaflow-network]
    ports:
      - "127.0.0.1:5432:5432"
    env_file: .env.production
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/protypai/pharmaflow-backend:latest
    build:
      context: ./apps/cloud-backend
      dockerfile: Dockerfile
      network: host
    container_name: pharmaflow-backend
    restart: unless-stopped
    networks: [pharmaflow-network]
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "127.0.0.1:5000:5000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: pharmaflow-nginx
    restart: unless-stopped
    networks: [pharmaflow-network]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
