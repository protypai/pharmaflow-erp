networks:
  pharmaflow-network:
    name: pharmaflow_shared_network
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmaflow-postgres
    restart: unless-stopped
    networks: [pharmaflow-network]
    expose:
      - "5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pharmaflow} -d $${POSTGRES_DB:-pharmaflow_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/cloud-backend
      dockerfile: Dockerfile
    container_name: pharmaflow-backend
    restart: unless-stopped
    networks: [pharmaflow-network]
    env_file:
      - .env
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: pharmaflow-nginx
    restart: unless-stopped
    networks: [pharmaflow-network]
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
