services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmaflow-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pharmaflow
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: pharmaflow_dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmaflow -d pharmaflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/cloud-backend
      dockerfile: Dockerfile
    container_name: pharmaflow-backend-dev
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: postgresql://pharmaflow:devpassword@postgres:5432/pharmaflow_dev
      JWT_SECRET: your_64_char_hex_secret_here_min_32_chars_never_hardcode
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: another_64_char_hex_refresh_secret_here
      JWT_REFRESH_EXPIRES_IN: 30d
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pharmaflow.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Sagar@2003}
      CORS_ORIGIN: "*"
      LOG_LEVEL: info
      RUN_SEEDING: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
