services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmaflow-postgres-dev
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: pharmaflow
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: pharmaflow_dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmaflow -d pharmaflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/cloud-backend
      dockerfile: Dockerfile
    container_name: pharmaflow-backend-dev
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: postgresql://pharmaflow:devpassword@postgres:5432/pharmaflow_dev
      # JWT secrets must be provided via the environment (e.g. a local .env file);
      # never commit real secrets here.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (e.g. `openssl rand -hex 32`)}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set (e.g. `openssl rand -hex 32`)}
      JWT_REFRESH_EXPIRES_IN: 30d
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pharmaflow.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      CORS_ORIGIN: "*"
      LOG_LEVEL: info
      RUN_SEEDING: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
