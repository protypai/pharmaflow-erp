version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmaflow-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pharmaflow
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: pharmaflow_dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmaflow -d pharmaflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
